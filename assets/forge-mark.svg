<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Forge">
  <title>Forge</title>
  <!--
    One silhouette, three masses: face, waist, base. No strokes, no curves — it
    knocks out of any background, and flat facets keep the profile readable when
    an avatar renders it small. The base is drawn wider than the face so the
    mark sits planted rather than top-heavy.
  -->
